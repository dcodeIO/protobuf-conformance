name: ci
on:
  pull_request:
    branches: [patched]
  workflow_dispatch:
# Prevent writing to the repository using the CI token.
# Ref: https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#permissions
permissions: read-all
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.sha || github.sha }}
      - name: Install
        run: npm ci
      - name: Run tests and create report
        run: npm test
      - name: Update license headers
        run: npm run license-header
      - name: Format
        run: npm run format
      - name: Generate patch
        if: >
          (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]') ||
          github.event_name == 'workflow_dispatch'
        run: |
          git add --intent-to-add -- \
            README.md \
            .github/genimg \
            ':(glob)impl/**/gen/**' \
            ':(glob)impl/**/failing_tests*.txt'
          git diff --binary -- \
            README.md \
            .github/genimg \
            ':(glob)impl/**/gen/**' \
            ':(glob)impl/**/failing_tests*.txt' \
            > "$RUNNER_TEMP/generated.patch"
      - name: Check non-generated diff
        if: >
          (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]') ||
          github.event_name == 'workflow_dispatch'
        run: |
          [[ -z $(git status --porcelain -- \
            . \
            ':(exclude)README.md' \
            ':(exclude).github/genimg/**' \
            ':(exclude,glob)impl/**/gen/**' \
            ':(exclude,glob)impl/**/failing_tests*.txt' \
            | tee /dev/stderr) ]] || exit 1
      - name: Upload patch
        if: >
          (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]') ||
          github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: generated-patch
          path: ${{ runner.temp }}/generated.patch
          retention-days: 1
      - name: Check Diff
        run: |
          [[ -z $(git status --porcelain | tee /dev/stderr) ]] || exit 1
